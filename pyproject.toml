[project]
name = "slicehash"
version = "0.1.0"
description = "SliceHash Mining Backend - Fair rotation and quota management for Stratum V2"
readme = "README.md"
authors = [
    { name = "Knezevic, Daniel | Dan | ECFD", email = "daniel.knezevic@rakuten.com" }
]
requires-python = ">=3.11"
dependencies = [
    "quart>=0.19.0",
    "aiosqlite>=0.19.0",
    "pydantic>=1.10.0,<2.0.0",
    "pyyaml>=6.0.0",
    "httpx>=0.28.1",
    "pyjwt>=2.8.0",
    "cryptography>=41.0.0",
    "qrcode>=7.4.2",
    "pillow>=10.0.0",
    "lnurl>=0.4.0",
    "cachetools>=5.0.0",
    "redis>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
