{% extends "base.html" %}

{% block title %}Purchases - MineShare{% endblock %}

{% block content %}
<div class="mobile-dashboard">
    <!-- Large shares remaining display -->
    <div class="shares-remaining-display">
        <div class="shares-label">Shares Remaining</div>
        <div class="shares-value" id="shares-remaining">{{ shares_remaining }}</div>
    </div>

    <!-- Target level display -->
    <div class="target-level-display">
        <div class="target-level-value" id="target-level">Block Target: Level 50+</div>
    </div>

    <!-- Purchase form -->
    <div class="purchase-form">
        <input
            type="number"
            id="purchase-amount"
            class="purchase-input"
            placeholder="Enter share amount"
            min="1"
            step="1"
        />
        <button class="btn-purchase-submit" id="purchase-submit-btn">
            Purchase
        </button>
    </div>

    <!-- Purchase history cards -->
    <div class="purchase-cards-container" id="purchase-cards-container">
        <!-- Purchase cards will be populated by JavaScript -->
    </div>

    <div id="empty-state" class="empty-state" style="display: none;">
        <p>No purchases yet</p>
    </div>

    <div id="loading-indicator" class="loading-indicator" style="display: none;">
        <p>Loading purchases...</p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='shared.js') }}"></script>
<script src="{{ url_for('static', filename='purchases.js') }}"></script>
{% endblock %}
