{% extends "base.html" %}

{% block title %}MineShare - Dashboard{% endblock %}

{% block content %}
<div class="mobile-dashboard">
    <!-- Network difficulty dot in top corner -->
    <div class="network-difficulty-dot" id="network-difficulty-dot" title="Network active">
        <span id="network-difficulty-value">0</span>
    </div>

    <!-- Target level display -->
    <div class="target-level-display">
        <div class="target-level-label">Target Level for Valid Block</div>
        <div class="target-level-value" id="target-level">Level 50+</div>
    </div>

    <!-- Large shares remaining display -->
    <div class="shares-remaining-display">
        <div class="shares-label">Shares Remaining</div>
        <div class="shares-value" id="shares-remaining">--</div>
    </div>

    <!-- Share cards container -->
    <div class="share-cards-container" id="share-cards-container">
        <!-- Share cards will be populated by JavaScript -->
    </div>

    <div id="empty-state" class="empty-state" style="display: none;">
        <p>No shares yet</p>
    </div>

    <div id="loading-indicator" class="loading-indicator" style="display: none;">
        <p>Loading more shares...</p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='shared.js') }}"></script>
<script src="{{ url_for('static', filename='dashboard.js') }}"></script>
{% endblock %}
