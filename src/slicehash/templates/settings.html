{% extends "base.html" %}

{% block title %}Settings - MineShare{% endblock %}

{% block content %}
<div class="settings-container">

    <div id="success-message" class="message success-message" style="display: none;"></div>
    <div id="error-message" class="message error-message" style="display: none;"></div>

    <form id="settings-form">
        <div class="form-group">
            <label for="address">Bitcoin Address</label>
            <input
                type="text"
                id="address"
                name="address"
                placeholder="bc1... / tb1... / bcrt1..."
                autocomplete="off"
            />
            <small class="field-help">Mainnet: bc1/1/3 | Testnet: tb1/m/n/2 | Regtest: bcrt1</small>
        </div>

        <div class="form-group">
            <label for="tag">Custom Tag</label>
            <input
                type="text"
                id="tag"
                name="tag"
                placeholder="my-miner"
                maxlength="50"
                autocomplete="off"
            />
            <small class="field-help">Optional label for your miner (max 50 characters)</small>
        </div>

        <button type="submit" id="save-button" class="btn-primary">
            Save Changes
        </button>
    </form>

    <div class="logout-section">
        <a href="/api/auth/logout" class="btn-logout">Logout</a>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='shared.js') }}"></script>
<script src="/static/settings.js"></script>
{% endblock %}
