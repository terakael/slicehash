apiVersion: v1
kind: Secret
metadata:
  name: slicehash-secrets
  namespace: default
type: Opaque
# stringData accepts plain text — no base64 encoding required.
# Replace every value below before applying to a cluster.
# Generate jwt_secret with: openssl rand -hex 32
stringData:
  DATABASE_USER: "slicehash"
  DATABASE_PASSWORD: "change_me"
  JWT_SECRET: "change_me_generate_with_openssl_rand_hex_32"
  REDIS_PASSWORD: ""
  BTC_RPC_USER: "your_rpc_username"
  BTC_RPC_PASSWORD: "your_rpc_password"
